- baseInfo:
    api_name: 用户登录
    url: /dar/user/login
    method: post
    header:
      Content-Type: application/x-www-form-urlencoded;charset=UTF-8
  testCase:
    - case_name: 用户名和密码正确--登录成功
      data:
        user_name: test01
        passwd: admin123
      validation:
        - contains: { 'error_code': none }
        - eq: { 'msg': '登录成功' }
      extract:
        token: $.token
    - case_name: 用户名和密码错误--登录失败
      data:
        user_name: test02
        passwd: 123456
      validation:
        - contains: { 'error_code': none }
        - eq: { 'msg': '登录失败' }
      extract:
        token: $.token